# =============================================================================
# Pipeline 1 (Backend): Azure DevOps CI/CD -> Docker Hub -> Homologação (Gates) -> Produção
# Arquitetura Big Tech: Build Once, Promote Many + 6 Camadas de Testes Automatizados
# =============================================================================

trigger:
  branches:
    include:
      - main
      - master
      - homolog
      - develop
  paths:
    include:
      - backend/**
      - tests/**

pr:
  branches:
    include:
      - main
      - master
      - homolog
      - develop
  paths:
    include:
      - backend/**
      - tests/**

# Gatilho Assíncrono Noturno (03:00 BRT / 06:00 UTC) para Testes Pesados de Estresse
# IMPORTANTE: always: false garante que SÓ roda de madrugada se houver novos commits na main!
schedules:
  - cron: '0 6 * * *'
    displayName: 'Bateria Noturna de Estresse (k6) & DAST Completo (OWASP ZAP)'
    branches:
      include:
        - main
    always: false

variables:
  DOCKERHUB_CONNECTION: 'dockerhub-connection'
  DOCKERHUB_USERNAME: 'joaogabriel199'
  IMAGE_NAME: '$(DOCKERHUB_USERNAME)/app-pessoal-backend'

  SSH_HOMOLOG_CONNECTION: 'azure-vm-homolog-ssh'
  SSH_PROD_CONNECTION: 'azure-vm-prod-ssh'

  HOMOLOG_API_URL: 'http://$(VM_HOMOLOG_IP):8080/api'
  NODE_VERSION: '24.x'

stages:
  # ===========================================================================
  # STAGE 1: CI Backend - Unitários + Integração + SAST + Build Único Docker Hub
  # ===========================================================================
  - stage: CI_Backend
    displayName: '1. CI Backend - Unitários, Integração, SAST & Push Docker Hub'
    jobs:
      - job: TestBuildAndPush
        displayName: 'Validar Código, Segurança SAST e Publicar Imagem Imutável'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            displayName: 'Clonar repositório'

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: |
              cd backend
              npm ci
              npx prisma generate
            displayName: 'Instalar dependências e gerar Prisma Client'

          - script: |
              cd backend
              npm test
            displayName: '1. Testes Unitários do Backend (Vitest)'

          - script: |
              cd backend
              npm run test:e2e
            displayName: '2. Testes de Integração HTTP / API (Supertest + Vitest)'

          - script: |
              cd backend
              npm audit --audit-level=high || true
            displayName: '5. Segurança SAST - Auditoria de Dependências (npm audit)'

          - task: Docker@2
            displayName: 'Build e Push para o Docker Hub ($(IMAGE_NAME):$(Build.BuildId))'
            inputs:
              containerRegistry: '$(DOCKERHUB_CONNECTION)'
              repository: '$(IMAGE_NAME)'
              command: 'buildAndPush'
              Dockerfile: 'backend/Dockerfile'
              buildContext: 'backend'
              tags: |
                $(Build.BuildId)
                latest

          - script: |
              docker run --rm aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0 $(IMAGE_NAME):$(Build.BuildId)
            displayName: '5. Segurança SAST - Scan de Vulnerabilidades da Imagem Docker (Trivy)'

  # ===========================================================================
  # STAGE 2: CD Homologação - Deploy em Ambiente de Homologação
  # ===========================================================================
  - stage: CD_Homologacao
    displayName: '2. CD - Deploy em Homologação'
    dependsOn: CI_Backend
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/homolog', 'refs/heads/develop', 'refs/heads/main', 'refs/heads/master'))
    jobs:
      - deployment: DeployBackendHomolog
        displayName: 'Atualizar Backend & Postgres em Homologação'
        environment: 'homologacao'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: 'SSH Homologação: Pull do Docker Hub e docker run'
                  inputs:
                    sshEndpoint: '$(SSH_HOMOLOG_CONNECTION)'
                    runOptions: 'inline'
                    inline: |
                      set -e
                      docker network inspect lifeos-homolog-net >/dev/null 2>&1 || docker network create lifeos-homolog-net

                      if [ ! "$(docker ps -q -f name=^lifeos-postgres-hml$)" ]; then
                        docker run -d \
                          --name lifeos-postgres-hml \
                          --restart always \
                          --network lifeos-homolog-net \
                          --network-alias postgres \
                          -e POSTGRES_USER=$(POSTGRES_USER_HML) \
                          -e POSTGRES_PASSWORD=$(POSTGRES_PASSWORD_HML) \
                          -e POSTGRES_DB=app_pessoal_hml \
                          -v postgres_hml_data:/var/lib/postgresql/data \
                          postgres:16-alpine
                      fi

                      docker pull $(IMAGE_NAME):$(Build.BuildId)
                      docker stop lifeos-backend-hml || true
                      docker rm lifeos-backend-hml || true

                      docker run -d \
                        --name lifeos-backend-hml \
                        --restart always \
                        --network lifeos-homolog-net \
                        --network-alias backend \
                        -e PORT=3000 \
                        -e DATABASE_URL="postgresql://$(POSTGRES_USER_HML):$(POSTGRES_PASSWORD_HML)@postgres:5432/app_pessoal_hml?schema=public" \
                        -e JWT_SECRET="$(JWT_SECRET_HML)" \
                        $(IMAGE_NAME):$(Build.BuildId)

                      docker image prune -f
                    failOnStdErr: false

  # ===========================================================================
  # STAGE 3: Quality Gate em Homologação (Jobs Paralelos: Carga k6 + Segurança OWASP ZAP)
  # ===========================================================================
  - stage: Quality_Gate_Homologacao
    displayName: '3. Validação em Homologação (Performance k6 & Segurança OWASP ZAP)'
    dependsOn: CD_Homologacao
    condition: succeeded()
    jobs:
      # Job Paralelo A: Teste de Performance e Carga com Grafana k6
      - job: Performance_Load_Test_k6
        displayName: '4. Testes de Performance / Carga (Grafana k6)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - script: |
              if [ "$(Build.Reason)" = "Schedule" ]; then
                PROFILE="stress"
              else
                PROFILE="smoke"
              fi
              echo "Executando Grafana k6 no perfil: $PROFILE contra $(HOMOLOG_API_URL)"
              docker run --rm -i \
                -e BASE_URL="$(HOMOLOG_API_URL)" \
                -e K6_PROFILE="$PROFILE" \
                -v $(System.DefaultWorkingDirectory)/tests/performance:/scripts \
                grafana/k6:latest run /scripts/k6-load-test.js
            displayName: 'Rodar Teste de Carga/Estresse k6 contra Homologação'

      # Job Paralelo B: Teste de Segurança Dinâmico (DAST) com OWASP ZAP via OpenAPI/Swagger
      - job: Security_DAST_OWASP_ZAP
        displayName: '5. Testes de Segurança DAST na API (OWASP ZAP + OpenAPI)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - script: |
              mkdir -p $(System.DefaultWorkingDirectory)/zap-reports
              chmod 777 $(System.DefaultWorkingDirectory)/zap-reports
              docker run --rm \
                -v $(System.DefaultWorkingDirectory)/backend:/zap/wrk/:rw \
                ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
                -t /zap/wrk/openapi.json \
                -f openapi \
                -O "$(HOMOLOG_API_URL)" \
                -I
            displayName: 'Auditar Rotas da API via Swagger/OpenAPI com OWASP ZAP'

  # ===========================================================================
  # STAGE 4: CD Produção - Promoção Instantânea do Binário Validado (Sem Recompilar)
  # ===========================================================================
  - stage: CD_Producao
    displayName: '4. CD - Promoção para Produção (Imutável)'
    dependsOn: Quality_Gate_Homologacao
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
    jobs:
      - deployment: DeployBackendProd
        displayName: 'Promover Imagem Validada ($(Build.BuildId)) para Produção'
        environment: 'producao'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: 'SSH Produção: Pull da Mesma Imagem Validada em Homolog e docker run'
                  inputs:
                    sshEndpoint: '$(SSH_PROD_CONNECTION)'
                    runOptions: 'inline'
                    inline: |
                      set -e
                      docker network inspect lifeos-prod-net >/dev/null 2>&1 || docker network create lifeos-prod-net

                      if [ ! "$(docker ps -q -f name=^lifeos-postgres$)" ]; then
                        docker run -d \
                          --name lifeos-postgres \
                          --restart always \
                          --network lifeos-prod-net \
                          --network-alias postgres \
                          -e POSTGRES_USER=$(POSTGRES_USER_PROD) \
                          -e POSTGRES_PASSWORD=$(POSTGRES_PASSWORD_PROD) \
                          -e POSTGRES_DB=app_pessoal \
                          -v postgres_prod_data:/var/lib/postgresql/data \
                          postgres:16-alpine
                      fi

                      # Promove exatamente a mesma imagem $(Build.BuildId) aprovada em Homologação!
                      docker pull $(IMAGE_NAME):$(Build.BuildId)
                      docker stop lifeos-backend || true
                      docker rm lifeos-backend || true

                      docker run -d \
                        --name lifeos-backend \
                        --restart always \
                        --network lifeos-prod-net \
                        --network-alias backend \
                        -e PORT=3000 \
                        -e DATABASE_URL="postgresql://$(POSTGRES_USER_PROD):$(POSTGRES_PASSWORD_PROD)@postgres:5432/app_pessoal?schema=public" \
                        -e JWT_SECRET="$(JWT_SECRET_PROD)" \
                        $(IMAGE_NAME):$(Build.BuildId)

                      docker image prune -f
                    failOnStdErr: false
