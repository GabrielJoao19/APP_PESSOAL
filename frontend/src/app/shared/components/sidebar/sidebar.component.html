<aside class="w-[260px] bg-white border-r border-[#E5E7EB] p-6 flex flex-col h-screen shrink-0">
  <!-- Logo -->
  <div class="font-bold text-xl flex items-center gap-3 mb-8 pb-6 border-b border-[#E5E7EB]">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="7" height="9" x="3" y="3" rx="1"/>
      <rect width="7" height="5" x="14" y="3" rx="1"/>
      <rect width="7" height="9" x="14" y="12" rx="1"/>
      <rect width="7" height="5" x="3" y="16" rx="1"/>
    </svg>
    <span class="tracking-tight text-gray-900">LifeOS</span>
  </div>

  <!-- Navigation -->
  <nav class="flex flex-col gap-1 flex-1">
    <a routerLink="/" routerLinkActive="bg-[#F3F4F6] text-gray-900 font-semibold" [routerLinkActiveOptions]="{exact: true}"
       class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-lg font-medium text-sm hover:bg-[#FAFAFA] hover:text-gray-900 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Check-in Diário
    </a>

    <a routerLink="/diarios" routerLinkActive="bg-[#F3F4F6] text-gray-900 font-semibold"
       class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-lg font-medium text-sm hover:bg-[#FAFAFA] hover:text-gray-900 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
        <path d="M6 6h10"/>
        <path d="M6 10h10"/>
      </svg>
      Meus Diários
    </a>

    <a routerLink="/saude" routerLinkActive="bg-[#F3F4F6] text-gray-900 font-semibold"
       class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-lg font-medium text-sm hover:bg-[#FAFAFA] hover:text-gray-900 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      Saúde &amp; Fitness
    </a>

    <a routerLink="/financas" routerLinkActive="bg-[#F3F4F6] text-gray-900 font-semibold"
       class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-lg font-medium text-sm hover:bg-[#FAFAFA] hover:text-gray-900 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.21 15.89A10 10 0 1 1 8 2.83"/>
        <path d="M22 12A10 10 0 0 0 12 2v10z"/>
      </svg>
      Finanças
    </a>

    <a routerLink="/metas" routerLinkActive="bg-[#F3F4F6] text-gray-900 font-semibold"
       class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-lg font-medium text-sm hover:bg-[#FAFAFA] hover:text-gray-900 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="12" cy="12" r="6"/>
        <circle cx="12" cy="12" r="2"/>
      </svg>
      Metas do Mês
    </a>

    <div class="mt-8 pt-4 border-t border-[#E5E7EB] flex flex-col gap-1">
      <a routerLink="/configuracoes" routerLinkActive="bg-[#F3F4F6] text-gray-900 font-semibold"
         class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-lg font-medium text-sm hover:bg-[#FAFAFA] hover:text-gray-900 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Configurações
      </a>

      @if (authService.isLoggedIn()) {
        <button (click)="authService.logout()"
                class="flex items-center gap-3 px-4 py-3 text-red-500 rounded-lg font-medium text-sm hover:bg-red-50 transition-colors w-full text-left">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
          Sair da Conta
        </button>
      } @else {
        <a routerLink="/login"
           class="flex items-center gap-3 px-4 py-3 text-emerald-600 rounded-lg font-medium text-sm hover:bg-emerald-50 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" x2="3" y1="12" y2="12"/>
          </svg>
          Fazer Login
        </a>
      }
    </div>
  </nav>
</aside>
