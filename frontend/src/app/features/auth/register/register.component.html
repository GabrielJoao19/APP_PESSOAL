<div class="min-h-screen w-screen flex items-center justify-center bg-[#FAFAFA] p-4">
  <div class="w-full max-w-md bg-white border border-[#E5E7EB] rounded-2xl p-8 shadow-xs">

    <!-- Logo -->
    <div class="flex items-center gap-2 mb-6 justify-center">
      <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="7" height="9" x="3" y="3" rx="1"/>
          <rect width="7" height="5" x="14" y="3" rx="1"/>
          <rect width="7" height="9" x="14" y="12" rx="1"/>
          <rect width="7" height="5" x="3" y="16" rx="1"/>
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight text-gray-900">LifeOS</span>
    </div>

    <h2 class="text-2xl font-bold text-center text-gray-900 mb-1">Crie sua conta</h2>
    <p class="text-sm text-gray-500 text-center mb-8">Comece a gerenciar sua vida em alta performance</p>

    @if (mensagemErro()) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
        {{ mensagemErro() }}
      </div>
    }

    <form (ngSubmit)="cadastrar()" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
          Nome
        </label>
        <input type="text" [(ngModel)]="nome" name="nome" required
               placeholder="Seu Nome Completo"
               class="w-full px-3.5 py-2.5 bg-white border border-[#E5E7EB] rounded-lg text-sm focus:outline-none focus:border-gray-500 transition-colors" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
          E-mail
        </label>
        <input type="email" [(ngModel)]="email" name="email" required
               placeholder="seu@email.com"
               class="w-full px-3.5 py-2.5 bg-white border border-[#E5E7EB] rounded-lg text-sm focus:outline-none focus:border-gray-500 transition-colors" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">
          Senha
        </label>
        <input type="password" [(ngModel)]="senha" name="senha" required
               placeholder="••••••••"
               class="w-full px-3.5 py-2.5 bg-white border border-[#E5E7EB] rounded-lg text-sm focus:outline-none focus:border-gray-500 transition-colors" />
      </div>

      <button type="submit" [disabled]="carregando() || !nome() || !email() || !senha()"
              class="mt-2 w-full py-2.5 bg-black hover:bg-gray-800 disabled:opacity-50 text-white font-semibold text-sm rounded-lg transition-colors cursor-pointer">
        {{ carregando() ? 'Criando conta...' : 'Cadastrar' }}
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-gray-500">
      Já tem uma conta?
      <a routerLink="/login" class="font-semibold text-gray-900 hover:underline">
        Faça login
      </a>
    </div>
  </div>
</div>
