<div class="h-full flex flex-col">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-base font-semibold text-[#111827] flex items-center gap-2">
      Desempenho de Setembro
      <span class="text-xs font-normal text-[#6B7280]">12 dias verdes</span>
    </h2>
  </div>

  <div class="bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl p-5">
    <!-- Cabeçalho dos dias da semana -->
    <div class="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-[#6B7280] mb-2">
      <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
    </div>

    <!-- Grade de Dias -->
    <div class="grid grid-cols-7 gap-2">
      @for (item of dias(); track $index) {
        @switch (item.status) {
          @case ('empty') {
            <div class="aspect-square"></div>
          }
          @case ('green') {
            <div class="aspect-square flex items-center justify-center text-xs font-medium rounded-md bg-[#D1FAE5] text-[#065F46] cursor-pointer hover:opacity-80 transition-opacity">
              {{ item.dia }}
            </div>
          }
          @case ('yellow') {
            <div class="aspect-square flex items-center justify-center text-xs font-medium rounded-md bg-[#FEF3C7] text-[#92400E] cursor-pointer hover:opacity-80 transition-opacity">
              {{ item.dia }}
            </div>
          }
          @case ('red') {
            <div class="aspect-square flex items-center justify-center text-xs font-medium rounded-md bg-[#FEE2E2] text-[#991B1B] cursor-pointer hover:opacity-80 transition-opacity">
              {{ item.dia }}
            </div>
          }
          @case ('future') {
            <div class="aspect-square flex items-center justify-center text-xs font-medium rounded-md bg-[#F3F4F6] text-[#9CA3AF]">
              {{ item.dia }}
            </div>
          }
        }
      }
    </div>
  </div>
</div>
