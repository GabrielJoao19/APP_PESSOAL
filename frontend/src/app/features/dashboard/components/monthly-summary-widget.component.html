<div class="h-auto flex flex-col justify-end">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-base font-semibold text-[#111827]">
      Resumo do Mês
    </h2>
    <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] text-[#6B7280]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" x2="18" y1="20" y2="10"/>
      <line x1="12" x2="12" y1="20" y2="4"/>
      <line x1="6" x2="6" y1="20" y2="14"/>
    </svg>
  </div>

  <div class="bg-[#FAFAFA] border border-[#E5E7EB] rounded-xl p-5">
    <!-- Dias Produtivos -->
    <div class="flex justify-between items-baseline mb-2">
      <span class="font-semibold text-xs text-gray-800">Dias Produtivos (Verdes)</span>
      <span class="font-bold text-xs text-[#10B981]">12 de 22</span>
    </div>
    <div class="w-full h-1.5 bg-[#E5E7EB] rounded-full overflow-hidden mb-5">
      <div class="h-full w-[54%] bg-[#10B981]"></div>
    </div>

    <!-- Orçamento Global do Mês (Dinâmico a partir dos Envelopes) -->
    <div class="flex justify-between items-baseline mb-2">
      <span class="font-semibold text-xs text-gray-800">Gasto Geral dos Envelopes</span>
      <span class="font-bold text-xs text-[#F59E0B]">
        R$ {{ financasService.totalGastoMes() | number:'1.0-0' }} / {{ financasService.totalOrcamentoMes() | number:'1.0-0' }}
      </span>
    </div>
    <div class="w-full h-1.5 bg-[#E5E7EB] rounded-full overflow-hidden">
      <div class="h-full bg-[#F59E0B] transition-all duration-300" [style.width.%]="percentualOrcamento()"></div>
    </div>
  </div>
</div>
