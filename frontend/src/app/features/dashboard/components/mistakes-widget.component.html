<div class="h-full flex flex-col">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-base font-semibold text-[#111827]">
      Registro de Erro
    </h2>
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#6B7280]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
      <line x1="12" x2="12" y1="9" y2="13"/>
      <line x1="12" x2="12.01" y1="17" y2="17"/>
    </svg>
  </div>

  <div class="border border-[#E5E7EB] rounded-xl overflow-hidden bg-white">
    @for (falha of falhasService.falhas(); track falha.id) {
      <div class="flex items-center justify-between p-3.5 border-b border-[#E5E7EB] last:border-b-0 hover:bg-[#FAFAFA] transition-colors cursor-pointer">
        <span class="text-sm font-medium text-[#111827]">{{ falha.descricao }}</span>
        <span class="bg-[#FEE2E2] text-[#EF4444] px-2 py-1 rounded text-xs font-semibold">
          -{{ falha.penalidade }}%
        </span>
      </div>
    }
  </div>
</div>
