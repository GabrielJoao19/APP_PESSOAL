<div class="h-full flex flex-col">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-base font-semibold text-[#111827]">
      Diário de Hoje
    </h2>
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#6B7280]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
  </div>

  <textarea [(ngModel)]="textoDiario"
            placeholder="Como foi seu dia? Descreva aprendizados, emoções, ou notas..."
            class="w-full min-h-[105px] p-3.5 border border-[#E5E7EB] rounded-lg bg-white text-[#111827] text-sm resize-y focus:outline-none focus:border-gray-500 transition-colors">
  </textarea>

  <div class="flex justify-between items-center mt-2">
    <span class="text-xs text-[#10B981] font-medium" [class.opacity-0]="!mensagemSalvo()">
      {{ mensagemSalvo() }}
    </span>
    <button (click)="salvar()"
            [disabled]="!textoDiario().trim() || salvando()"
            class="bg-black hover:bg-gray-800 disabled:opacity-40 text-white font-medium text-xs px-4 py-2.5 rounded-lg cursor-pointer transition-colors">
      {{ salvando() ? 'Salvando no banco...' : 'Salvar Registro' }}
    </button>
  </div>
</div>
