# =============================================================================
# Pipeline 2 (Frontend): Azure DevOps CI/CD -> Docker Hub -> Homologação (E2E/Mobile/ZAP) -> Produção
# Arquitetura Big Tech: Build Once, Promote Many + E2E Playwright (Desktop & Mobile)
# =============================================================================

trigger:
  branches:
    include:
      - main
      - master
      - homolog
      - develop
  paths:
    include:
      - frontend/**

pr:
  branches:
    include:
      - main
      - master
      - homolog
      - develop
  paths:
    include:
      - frontend/**

# Gatilho Assíncrono Noturno (03:00 BRT / 06:00 UTC) — só executa se houve novos commits na main (always: false)
schedules:
  - cron: '0 6 * * *'
    displayName: 'Bateria Noturna E2E Completa + Auditoria DAST OWASP ZAP'
    branches:
      include:
        - main
    always: false

variables:
  DOCKERHUB_CONNECTION: 'dockerhub-connection'
  DOCKERHUB_USERNAME: 'joaogabriel199'
  IMAGE_NAME: '$(DOCKERHUB_USERNAME)/app-pessoal-frontend'

  SSH_HOMOLOG_CONNECTION: 'azure-vm-homolog-ssh'
  SSH_PROD_CONNECTION: 'azure-vm-prod-ssh'

  HOMOLOG_WEB_URL: 'http://$(VM_HOMOLOG_IP):8080'
  NODE_VERSION: '24.x'

stages:
  # ===========================================================================
  # STAGE 1: CI Frontend - Testes Unitários (Jasmine) + SAST + Build Único Docker Hub
  # ===========================================================================
  - stage: CI_Frontend
    displayName: '1. CI Frontend - Testes Unitários, SAST & Push Docker Hub'
    jobs:
      - job: TestBuildAndPush
        displayName: 'Testar Angular, Auditar Segurança e Publicar Imagem no Docker Hub'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            displayName: 'Clonar repositório'

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          - script: |
              cd frontend
              npm ci
            displayName: 'Instalar dependências do Frontend'

          - script: |
              cd frontend
              npx ng test --watch=false --browsers=ChromeHeadless
            displayName: '1. Testes Unitários do Frontend (Karma + Headless Chrome)'

          - script: |
              cd frontend
              npm audit --audit-level=high || true
            displayName: '5. Segurança SAST - Auditoria de Dependências (npm audit)'

          - task: Docker@2
            displayName: 'Build e Push para o Docker Hub ($(IMAGE_NAME):$(Build.BuildId))'
            inputs:
              containerRegistry: '$(DOCKERHUB_CONNECTION)'
              repository: '$(IMAGE_NAME)'
              command: 'buildAndPush'
              Dockerfile: 'frontend/Dockerfile'
              buildContext: 'frontend'
              tags: |
                $(Build.BuildId)
                latest

          - script: |
              docker run --rm aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 0 $(IMAGE_NAME):$(Build.BuildId)
            displayName: '5. Segurança SAST - Scan de Vulnerabilidades da Imagem Nginx (Trivy)'

  # ===========================================================================
  # STAGE 2: CD Homologação - Deploy do Container Frontend/Nginx na Porta 8080
  # ===========================================================================
  - stage: CD_Homologacao
    displayName: '2. CD - Deploy em Homologação (Porta 8080)'
    dependsOn: CI_Frontend
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/homolog', 'refs/heads/develop', 'refs/heads/main', 'refs/heads/master'))
    jobs:
      - deployment: DeployFrontendHomolog
        displayName: 'Atualizar Frontend/Nginx em Homologação (Porta 8080)'
        environment: 'homologacao'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: 'SSH Homologação: Pull do Docker Hub e docker run na Porta 8080'
                  inputs:
                    sshEndpoint: '$(SSH_HOMOLOG_CONNECTION)'
                    runOptions: 'inline'
                    inline: |
                      set -e
                      docker network inspect lifeos-homolog-net >/dev/null 2>&1 || docker network create lifeos-homolog-net

                      docker pull $(IMAGE_NAME):$(Build.BuildId)
                      docker stop lifeos-frontend-hml || true
                      docker rm lifeos-frontend-hml || true

                      docker run -d \
                        --name lifeos-frontend-hml \
                        --restart always \
                        --network lifeos-homolog-net \
                        -p 8080:80 \
                        $(IMAGE_NAME):$(Build.BuildId)

                      docker image prune -f
                    failOnStdErr: false

  # ===========================================================================
  # STAGE 3: Quality Gate em Homologação (Jobs Paralelos: E2E + Mobile Playwright & DAST ZAP)
  # ===========================================================================
  - stage: Quality_Gate_Homologacao
    displayName: '3. Validação em Homologação (E2E, Mobile Playwright & Segurança DAST)'
    dependsOn: CD_Homologacao
    condition: succeeded()
    jobs:
      # Job Paralelo A: Testes E2E (Desktop Chrome) + Testes Mobile (iPhone 14 Viewport)
      - job: E2E_and_Mobile_Playwright
        displayName: '3 & 6. Testes End-to-End (E2E) e Mobile (Playwright)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: '$(NODE_VERSION)'
          - script: |
              cd frontend
              npm ci
              npx playwright install --with-deps chromium webkit
              E2E_BASE_URL="$(HOMOLOG_WEB_URL)" npx playwright test
            displayName: 'Executar Suíte Playwright (Desktop Chromium + Mobile iPhone 14)'

      # Job Paralelo B: Auditoria de Segurança Dinâmica (DAST) no Frontend/Nginx com OWASP ZAP
      - job: Security_DAST_Frontend_ZAP
        displayName: '5. Testes de Segurança DAST Web (OWASP ZAP Baseline)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              docker run --rm ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
                -t "$(HOMOLOG_WEB_URL)" \
                -I
            displayName: 'Validar Security Headers do Nginx e XSS com OWASP ZAP Baseline'

  # ===========================================================================
  # STAGE 4: CD Produção - Promoção Instantânea do Binário Validado (Porta 80)
  # ===========================================================================
  - stage: CD_Producao
    displayName: '4. CD - Promoção para Produção (Porta 80)'
    dependsOn: Quality_Gate_Homologacao
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
    jobs:
      - deployment: DeployFrontendProd
        displayName: 'Promover Imagem Validada ($(Build.BuildId)) para Produção (Porta 80)'
        environment: 'producao'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: SSH@0
                  displayName: 'SSH Produção: Pull da Mesma Imagem Validada em Homolog e docker run na Porta 80'
                  inputs:
                    sshEndpoint: '$(SSH_PROD_CONNECTION)'
                    runOptions: 'inline'
                    inline: |
                      set -e
                      docker network inspect lifeos-prod-net >/dev/null 2>&1 || docker network create lifeos-prod-net

                      # Promove exatamente a mesma imagem $(Build.BuildId) aprovada em Homologação!
                      docker pull $(IMAGE_NAME):$(Build.BuildId)
                      docker stop lifeos-frontend || true
                      docker rm lifeos-frontend || true

                      docker run -d \
                        --name lifeos-frontend \
                        --restart always \
                        --network lifeos-prod-net \
                        -p 80:80 \
                        $(IMAGE_NAME):$(Build.BuildId)

                      docker image prune -f
                    failOnStdErr: false
