server {
    listen 80;
    server_name _;

    # Compressão Gzip para performance em produção
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cabeçalhos básicos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Proxy Reverso para o Backend NestJS
    # Toda requisição que começa com /api/ é repassada internamente para o container backend na porta 3000
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Servidor de arquivos estáticos do Angular (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Permite roteamento SPA do Angular sem dar erro 404 ao atualizar a página (F5)
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos compilados pelo Angular (JS, CSS, fontes, imagens)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
